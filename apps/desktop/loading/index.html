<!doctype html>
<!--
  The desktop app's `frontendDist` (see ../src-tauri/tauri.conf.json) — the
  very first thing the window shows, before the real vibedeck UI exists
  anywhere. It stays on screen only for the second or two it takes the Node
  sidecar server to come up; main.rs polls the server's stdout for its
  readiness line and then calls `window.navigate()` to replace this page
  with the real app entirely (see main.rs's `wait_for_server` for why a
  stdout line, not a fixed sleep or a port-polling loop).

  If the server never comes up (missing Node, a crash, a stuck port —
  main.rs's own comment lists what it actually checked for), main.rs
  `eval()`s a script into THIS page to replace the status text below with a
  real error message, instead of leaving a blank/spinning window forever —
  that's the whole reason this file exists rather than an empty stub.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vibedeck</title>
    <style>
      /* Matches docs/DESIGN.md's dark palette (--bg/--text/--accent) so this
         loading screen doesn't flash a different theme than the real app
         that's about to replace it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0b;
        color: #e8e8ea;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        max-width: 420px;
        padding: 0 24px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 16px;
        border-radius: 50%;
        border: 2.5px solid #232329;
        border-top-color: #2a6df4;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 13px;
        color: #8a8a94;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" id="spinner"></div>
      <div id="status">Starting the vibedeck server…</div>
    </div>
  </body>
</html>
