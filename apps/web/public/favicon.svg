  <rect x="6.75" y="7.75" width="18.5" height="16.5" rx="3" stroke="#e8e8ea" stroke-width="1.5"/>
  <path d="M14.25 8V24" stroke="#e8e8ea" stroke-width="1.5"/>
  <path d="M14.25 16h11" stroke="#e8e8ea" stroke-width="1.5"/>
  <rect x="8.75" y="9.75" width="3.5" height="12.5" rx="1.25" fill="#2a6df4"/>
</svg>
