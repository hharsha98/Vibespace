<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vibespace — agentic dev workroom</title>
    <style>
      /* A minimal reset — the three-column shell (App.tsx) fills exactly
         100vh, and a default browser body margin would push it past the
         viewport and cause a page-level scrollbar around the whole app. */
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
