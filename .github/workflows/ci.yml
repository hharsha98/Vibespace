name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Both operating systems, because for a while this only ran on Linux —
    # which is the one platform Vibespace does not ship a verified build
    # for. That gap is not academic: `node-pty` and `better-sqlite3` are
    # native addons compiled per platform, the pty tests spawn real shells,
    # and the released, hand-verified artifact is the macOS DMG. Testing
    # exclusively on Linux meant the thing people actually download was the
    # thing CI never exercised.
    #
    # macOS runners are slower and more contended than Linux ones, which is
    # why `swarm/routes.test.ts`'s pty wait was raised from 10s to 30s in
    # the same change — see that helper's comment. A matrix that goes red
    # at random teaches people to ignore red.
    strategy:
      fail-fast: false # one platform failing should not hide the other's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Without this the action does not scan a pull request at all: it
          # exits with "GITHUB_TOKEN is now required to scan pull requests"
          # and fails the job before reading a single line. That is what it
          # has done on every PR this repo has had — so the secret gate was
          # not catching leaks and passing, it was erroring out and being
          # read as a flaky job. A security check that never runs is worse
          # than no check at all, because it looks like one.
          #
          # This is the token Actions injects into the job automatically,
          # not a credential stored anywhere; gitleaks only needs it to
          # enumerate the commits belonging to the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
